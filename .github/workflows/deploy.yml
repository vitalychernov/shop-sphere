name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/shop-sphere
            git pull origin main
            cd backend
            npm ci --omit=dev
            npm run build
            pm2 restart shop-sphere || pm2 start dist/server.js --name shop-sphere
            pm2 save
